<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .s { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .m { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    .in { opacity: 0; animation: in .9s ease-out forwards; }
    .d1 { animation-delay: .15s; } .d2 { animation-delay: .3s; } .d3 { animation-delay: .45s; }
    @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .grow { transform-origin: left; transform: scaleX(0); animation: g 1.2s .2s ease-out forwards; }
    @keyframes g { to { transform: scaleX(1); } }
  </style>
  <rect width="900" height="240" rx="12" fill="#0D1117"/>
  <rect x=".5" y=".5" width="899" height="239" rx="12" fill="none" stroke="#30363D"/>
  <rect x="48" y="52" width="4" height="96" fill="#58A6FF"/>
  <text class="m in" x="72" y="68" font-size="13" fill="#58A6FF" letter-spacing="2">DESARROLLADOR FULL-STACK</text>
  <text class="s in d1" x="70" y="118" font-size="46" font-weight="700" fill="#F0F6FC" letter-spacing="-1">Ney Salazar</text>
  <text class="s in d2" x="72" y="146" font-size="16" fill="#8B949E">Ingeniería de Sistemas · Universidad Simón Bolívar · Barranquilla, Colombia</text>
  <rect class="grow" x="48" y="178" width="804" height="1" fill="#30363D"/>
  <g class="m in d3" font-size="13" fill="#8B949E">
    <text x="48" y="208">E-commerce</text>
    <text x="160" y="208" fill="#30363D">/</text>
    <text x="180" y="208">Pagos en línea</text>
    <text x="318" y="208" fill="#30363D">/</text>
    <text x="338" y="208">IA aplicada</text>
    <text x="458" y="208" fill="#30363D">/</text>
    <text x="478" y="208">Seguridad</text>
  </g>
  <g class="in d3">
    <rect x="652" y="190" width="200" height="28" rx="14" fill="none" stroke="#58A6FF"/>
    <circle cx="672" cy="204" r="4" fill="#22C55E"/>
    <text class="s" x="684" y="209" font-size="13" fill="#F0F6FC">Disponible para trabajar</text>
  </g>
</svg>
